camera:
  width: 1280
  height: 720
  format: RGB888
  jpeg_quality: 88
  # Both flips correct the camera module mounted upside down (180 degrees).
  hflip: false
  vflip: true

face_recognition:
  poll_interval: 0.5
  result_max_age: 4.0

weapon_detection:
  model_path: exported_models/yolo26s.tflite
  classes_path: classes_yolo26.txt
  input_width: 640
  input_height: 640
  confidence_threshold: 0.7
  iou_threshold: 0.4
  poll_interval: 0.3
  result_max_age: 4.0

lock_control:
  lock_pin: 23
  indicator_led_pin: 24
  lock_active_low: true
  indicator_led_on_when_locked: true
  unlock_duration: 5.0
  weapon_hold_duration: 10.0
  weapon_scan_max_age: 4.0
  face_confirmations: 2
  face_confirmation_window: 3.0
  face_rearm_delay: 2.0
  unlock_modes:
    - full

# BCM GPIO numbers; UART routing must also be enabled in the Pi boot config.
gsm:
  default_phone: "+8801719473555"
  tx_pin: 14
  rx_pin: 15
  serial_device: /dev/ttyAMA0
  baud_rate: 9600
  command_timeout: 3.0
  sms_timeout: 30.0
  health_interval: 10.0
  alerts:
    enabled: true
    sms_enabled: true
    message: "ALERT: A weapon has been detected by the surveillance system."
    call_enabled: false
    call_duration: 20.0
    cooldown: 60.0
    clear_duration: 5.0
