<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Intelligent Surveillance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="screen">
      <header class="header-bar">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1>Intelligent Surveillance System</h1>
        <div class="live-indicator"><span></span> LIVE</div>
        <div class="wifi-indicator" aria-label="Wi-Fi status">
          <span class="wifi-icon" aria-hidden="true"></span>
          <span class="wifi-text">WIFI</span>
        </div>
      </header>

      <section class="feed-frame" aria-label="Live camera feed">
        <img id="camera-feed" src="{{ url_for('video_feed') }}" alt="Live camera feed">
        <div id="camera-error" class="camera-error" hidden>
          <div class="error-icon" aria-hidden="true">!</div>
          <strong>CAMERA NOT FOUND</strong>
          <span>Connect the Picamera2 device to view the live feed.</span>
        </div>
        <div class="feed-label">CAMERA 01</div>
      </section>

      <footer>Made by AMD36</footer>
    </main>
    <script>
      const feed = document.getElementById('camera-feed');
      const cameraError = document.getElementById('camera-error');
      const wifiIndicator = document.querySelector('.wifi-indicator');
      let cameraConnected = false;

      function refreshFeed() {
        feed.src = `{{ url_for('video_feed') }}?t=${Date.now()}`;
      }

      function showCameraError() {
        feed.hidden = true;
        cameraError.hidden = false;
      }

      function updateStatus() {
        fetch("{{ url_for('status') }}", { cache: 'no-store' })
          .then(response => response.json())
          .then(status => {
            cameraError.hidden = status.camera.connected;
            if (status.camera.connected && !cameraConnected) {
              refreshFeed();
            }
            if (!status.camera.connected) {
              showCameraError();
            }
            cameraConnected = status.camera.connected;
            wifiIndicator.classList.toggle('connected', status.wifi.connected);
            wifiIndicator.classList.toggle('disconnected', !status.wifi.connected);
            wifiIndicator.title = status.wifi.connected ? 'Wi-Fi connected' : 'Wi-Fi disconnected';
          })
          .catch(() => wifiIndicator.classList.add('disconnected'));
      }

      feed.addEventListener('error', () => {
        cameraConnected = false;
        showCameraError();
        setTimeout(updateStatus, 500);
      });
      updateStatus();
      setInterval(updateStatus, 5000);
    </script>
  </body>
</html>
